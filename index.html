<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube手順ダッシュボード（JSON連動版）</title>
  
  <script type="module" src="https://cdn.cubing.net/v0/js/cubing/twisty"></script>
  
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f6f8;
      color: #202124;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1a73e8;
    }

    /* 操作エリア（セレクトボックスと検索窓） */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0 30px 0;
    }
    .select-input, .search-input {
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #dadce0;
      border-radius: 8px;
      outline: none;
    }
    .select-input { background-color: white; cursor: pointer; }
    .search-input { width: 100%; max-width: 400px; }
    .select-input:focus, .search-input:focus { border-color: #1a73e8; }

    /* Grid配置 */
    .procedure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* カードUI */
    .alg-card {
      background: white;
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04);
      border: 1px solid #eef2f5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .alg-name { font-size: 1.2rem; font-weight: bold; color: #1a73e8; margin-bottom: 8px; }
    .alg-moves {
      font-family: monospace; font-size: 1.15rem; font-weight: bold;
      background: #f1f3f4; padding: 12px; border-radius: 6px; margin-bottom: 15px; color: #3c4043;
    }

    /* ドロップダウン */
    .dropdown-btn {
      width: 100%; padding: 10px; background: #1a73e8; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    .dropdown-content {
      max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out;
      background: #fafafa; border-radius: 6px; margin-top: 10px; display: flex; justify-content: center;
    }
    twisty-player { width: 240px; height: 240px; }
  </style>
</head>
<body>

<div class="container">
  <h1>Cube手順ダッシュボード</h1>

  <div class="controls">
    <select id="algsetSelect" class="select-input" onchange="loadAlgset(this.value)">
      <option value="3style">3style</option>
    </select>
    
    <input type="text" id="searchInput" class="search-input" placeholder="手順名、記号、通し番号で検索...">
  </div>

  <div class="procedure-grid" id="gridContainer"></div>
</div>


</body>
</html>
